# Three gateway replicas behind nginx, sharing Postgres + Redis.
#
# The point of this file is to demonstrate the architectural claim: the replicas
# are identical and stateless, nginx round-robins WebSocket upgrades across them
# with NO sticky sessions / ip_hash, and two browsers landing on different
# replicas still converge — because fan-out goes through Redis Pub/Sub and
# durability goes through Postgres.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncpad
      POSTGRES_PASSWORD: syncpad
      POSTGRES_DB: syncpad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncpad -d syncpad"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SYNCPAD_ENV: prod
      SYNCPAD_DATABASE_URL: postgresql+asyncpg://syncpad:syncpad@db:5432/syncpad
      SYNCPAD_REDIS_URL: redis://redis:6379/0
      SYNCPAD_JWT_SECRET: ${SYNCPAD_JWT_SECRET:-dev-insecure-change-me}
      SYNCPAD_SNAPSHOT_EVERY_OPS: "200"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    expose:
      - "8000"

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    ports:
      - "8080:80"

volumes:
  pgdata:
