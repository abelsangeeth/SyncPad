[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncpad"
version = "1.0.0"
description = "Real-time collaborative document editor built on an RGA CRDT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # The [asyncio] extra is what pulls greenlet, which the async engine
    # requires at import time. Recent SQLAlchemy no longer installs it
    # implicitly, and its absence is invisible on a developer machine where
    # some other package already provided it - it surfaces only in a clean
    # container, as an ImportError at startup.
    "sqlalchemy[asyncio]>=2.0.30",
    # Not a dev-only tool: the container image runs "alembic upgrade head" as
    # its release step, so migrations must be installed in the runtime image.
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "websockets>=12",
    # Lets the Redis adapters be exercised without a Redis server, so the
    # single-connection multiplexing and reconnect paths are covered by the
    # default test run rather than only in CI.
    "fakeredis>=2.20",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["syncpad*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: needs live Postgres/Redis (SYNCPAD_INTEGRATION=1)"]

[tool.coverage.run]
source = ["syncpad"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '@overload',
    '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# B008: FastAPI's Depends() in a default argument is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The benchmarks orchestrate subprocesses and poll for readiness, so a
# `timeout` argument (ASYNC109) and a little blocking filesystem work during
# setup (ASYNC240) are exactly right there, whatever they would mean in the
# request path.
"../bench/*.py" = ["ASYNC109", "ASYNC240"]
"tests/*.py" = ["ASYNC109"]
