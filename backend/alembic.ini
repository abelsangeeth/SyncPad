# Production schema migrations. Dev and the test suite use create_all instead
# (see syncpad.storage.db.init_models), which is why this file is short.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is supplied at runtime from SYNCPAD_DATABASE_URL — see alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
