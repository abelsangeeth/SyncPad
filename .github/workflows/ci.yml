name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check backend/syncpad backend/tests bench
      - name: ruff format --check
        run: ruff format --check backend/syncpad backend/tests bench

  test:
    name: Unit tests (sqlite, in-memory hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "backend[dev]"
      - name: pytest with coverage gate
        working-directory: backend
        run: |
          pytest -q \
            --cov=syncpad --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=92
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  integration:
    name: Integration (Postgres + Redis + 2 replicas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncpad
          POSTGRES_PASSWORD: syncpad
          POSTGRES_DB: syncpad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syncpad -d syncpad"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SYNCPAD_INTEGRATION: "1"
      SYNCPAD_DATABASE_URL: postgresql+asyncpg://syncpad:syncpad@localhost:5432/syncpad
      SYNCPAD_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e "backend[dev]"
      - name: Integration-marked tests
        working-directory: backend
        run: pytest -q -m integration
      - name: Migrations apply cleanly and match the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Cross-replica convergence over real Redis and Postgres
        run: |
          python -m bench.replica_convergence             --replicas 3 --clients 12 --ops 50             --database-url "$SYNCPAD_DATABASE_URL"             --redis-url "$SYNCPAD_REDIS_URL"

  bench:
    name: Benchmarks (latency, cold load, CRDT conformance)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e "backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CRDT conformance — Python and JavaScript must agree exactly
        run: python bench/conformance.py --trials 150 --sites 4 --steps 30
      - name: Broadcast latency under concurrent editors
        # The threshold reflects what one replica sustains in CI. Scaling past
        # it is the load balancer's job, and bench/scaleout.py measures that.
        run: |
          python bench/loadtest.py             --clients 25 --duration 20 --workers 4 --assert-p95-ms 150
      - name: Cold-load cost is bounded by the snapshot interval
        run: |
          python bench/coldload.py             --ops 3000 --snapshot-every 200 --max-chars 20000             --assert-speedup 3.0 --assert-time-reduction-pct 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results/

  docker:
    name: Docker build + stack smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: syncpad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bring up the 3-replica stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through the load balancer
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/metrics | head -20
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
